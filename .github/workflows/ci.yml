name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde_password
          POSTGRES_DB: fde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde -d fde_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fde:fde_password@localhost:5432/fde_test
      JWT_SECRET: ci-test-secret
      WEBHOOK_BACKOFF_BASE_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests against PostgreSQL
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the stack and smoke test the health endpoint
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
